version: "2"

linters:
  # Every linter golangci-lint ships. Anything disabled below carries a
  # measured finding count and a reason that survives reading the findings.
  # That is the bar for adding another entry: count them, read them, and
  # write down why they are wrong here.
  default: all

  disable:
    - exhaustruct # replaced by exhaustruct_v5, which is on
    - wsl # replaced by wsl_v5, which is on
    - gomodguard # replaced by gomodguard_v2, which is on

    # 26 findings, and the linter takes no settings in this release, so the
    # choice is all or nothing. Every one is on a type whose unset fields
    # are the design rather than an omission.
    #
    # Event is a discriminated union: exactly one of its four payload
    # pointers is non-nil, and which one is what Kind means. Naming all four
    # at every construction would write three explicit nils per event to say
    # what the kind already says, and would make the one field that differs
    # the hardest thing to see.
    #
    # ConsequenceEvent's payload is deliberately ragged -- a kind fills the
    # fields it needs and no others -- which the type's own doc comment
    # explains, and which a struct per kind would turn into thirteen types
    # differing by two fields each. Provenance and Inputs are filled in
    # stages as generation proceeds.
    - exhaustruct_v5

    # 2 findings, and the linter takes no settings, so the choice is all or
    # nothing. Both are immutable tables: the six characteristics in the
    # order the book prints them, and the modifier bands of p. 14. Go has no
    # const for an array, so the alternative is an accessor that clones on
    # every call -- in the engine's assignment loop, to prevent a mutation
    # nothing in this module performs and the tests would catch.
    - gochecknoglobals

  settings:
    depguard:
      # depguard's own default is a deny-all list that flags this module's
      # own imports, so the choice was never on or off but configured or
      # meaningless. Most of the PRD's layering is enforced by the compiler,
      # because the reverse edge is an import cycle. These are the edges
      # that would otherwise compile.
      rules:
        dice-knows-no-rules:
          files: ["**/dice/*.go"]
          deny:
            - pkg: github.com/philoserf/cschargen/career
              desc: dice knows the shapes of throw, never what a throw means

    errcheck:
      check-type-assertions: true

    exhaustive:
      # A default case is not exhaustiveness. The point is to be told when a
      # value is added, not to have it silently fall through.
      default-signifies-exhaustive: false
      check: [switch, map]

    godot:
      # Doc comments here end in a quotation from the page, and a quotation
      # ends with its closing quotation mark. This linter's autofix appends
      # a period after the quote, putting punctuation outside the quotation
      # it belongs to.
      exclude: ['"$']

    gosec:
      excludes:
        # The dice are meant to be predictable from a seed: that is the
        # whole determinism contract. A cryptographic source would defeat
        # the tool rather than harden it.
        - G404
        # 5 findings, every one a test reading back a file it just wrote
        # inside its own t.TempDir(). The path is a variable because the
        # directory is a fresh one per test; a constant path would be the
        # bug this rule exists to catch.
        - G304

    govet:
      enable-all: true
      disable:
        # fieldalignment reorders struct fields for memory layout. A
        # record's field order is the order it prints in, and a table's is
        # the order it reads in; neither is negotiable for a few bytes of
        # padding.
        - fieldalignment

    nolintlint:
      # A //nolint is a disable one line wide and carries the same burden of
      # proof as an entry in the disable list: name the linter, say why.
      # allow-unused false also deletes a suppression once it has stopped
      # suppressing anything.
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: exported
          disabled: false

    varnamelen:
      # Short names in short scopes are idiomatic. The default distance of
      # five lines calls a loop index over a seven-line body too terse,
      # which is not a finding about this code.
      max-distance: 12
      ignore-names: [i, n, d, r, t, tc, ok, id, fn]

    wsl_v5:
      # Every check, not the default subset.
      default: all

  exclusions:
    rules:
      # A transcribed table is a literal of printed numbers, and career/ is
      # nothing else. 51 findings: 25 of them the target number 8, which is
      # common but is not one concept -- the book prints 6, 7, 8 and 10 as
      # targets in different places, so naming 8 would assert a rule it does
      # not have. The rest are cash values and characteristic deltas, each
      # of which is the cell it sits in.
      - linters: [mnd]
        path: career/

      # 27 findings, every one a skill name, a table heading or a mishap
      # summary that recurs because the book prints it in several places.
      # Collapsing a repeated cell into a constant is exactly the coupling
      # the transcription exists to prevent: one constant means one typo
      # reaches every cell that shares it, and the second reading stops
      # being independent of the first.
      - linters: [goconst]
        path: career/

      # 4 findings: three d66 event tables of 36 rows each, and one block of
      # three assignments. They are data, written as functions because Go
      # has no other way to build a map of literals. Splitting a table into
      # six functions of six rows would make it harder to check against the
      # page, which is the only thing that matters about it.
      - linters: [funlen]
        path: career/

      # 4 findings, all in career/'s own tests. A test that checks a table
      # cell by cell has the complexity of the table it checks: the shape
      # test walks three careers' events, mishaps, benefits and assignments,
      # and the transcription tests read a page's numbers a second time.
      # Splitting one into three would hide that they are one check.
      - linters: [cyclop, gocognit]
        path: career/.*_test\.go

# gofumpt rather than gofmt: a strict superset, so enabling it makes gofmt
# redundant rather than contradictory. It ships inside golangci-lint, so it
# costs the gate no separate install and moves when golangci-lint moves.
# This is the single definition of "formatted" for Go here -- the Taskfile
# runs no Go formatter of its own, or the two could come to disagree.
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true

issues:
  # Show every finding. The defaults cap output per linter and per repeated
  # message, which on a gate running default: all would let a count read
  # smaller than it is.
  max-issues-per-linter: 0
  max-same-issues: 0
